# Production-like stack: nginx serves the built SPA and proxies /api to the API.
# Needs a .env file with SECRET_KEY and POSTGRES_PASSWORD (see .env.example).
services:
  server:
    build:
      context: ./server
      target: production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoledger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autoledger}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORS_ORIGINS: '[]'
    depends_on:
      db:
        condition: service_healthy
    restart: always

  client:
    build:
      context: ./client
      target: production
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autoledger}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: always

volumes:
  db_data_prod:
