version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: car_tracker_server_prod
    ports:
      - "8000:8000"
    volumes:
      # Persist database file
      - ./car_tracker.db:/app/car_tracker.db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/car_tracker
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn server.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    restart: always
    networks:
      - app_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    image: car_tracker_client:prod
    container_name: car_tracker_client_prod
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
    networks:
      - app_network

  db:
    image: postgres:15
    container_name: car_tracker_db_prod
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=car_tracker
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - app_network
    restart: always

volumes:
  db_data_prod:


networks:
  app_network:
    driver: bridge
