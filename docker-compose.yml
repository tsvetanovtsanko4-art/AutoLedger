# Local development: hot reload for the API and the Vite dev server.
services:
  server:
    build:
      context: ./server
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoledger}:${POSTGRES_PASSWORD:-autoledger}@db:5432/${POSTGRES_DB:-autoledger}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-0123456789}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
      # vite-plugin-mkcert keeps its local CA here, so the browser only has to trust it once
      - ./client/certs:/root/.vite-plugin-mkcert
    environment:
      VITE_API_TARGET: http://server:8000
    depends_on:
      - server
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoledger}
      POSTGRES_DB: ${POSTGRES_DB:-autoledger}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
