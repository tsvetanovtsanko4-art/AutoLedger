version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: car_tracker_server_dev
    ports:
      - "8000:8000"
    volumes:
      # Persist database file
      - ./car_tracker.db:/app/car_tracker.db
      # Mount source for hot reload
      - ./server:/app/server
    environment:
      - DATABASE_URL=sqlite:////app/car_tracker.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - app_network
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: car_tracker_client_dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload with polling
      - ./client:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://server:8000
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
