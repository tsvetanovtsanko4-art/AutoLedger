# One controller and two load generators. Each worker logs in a different
# range of seeded users (user_offset) so their drivers never share a car.
x-worker: &worker
  build: .
  image: autoledger-jmeter:5.6.3

services:
  worker1:
    <<: *worker
    command: jmeter-server -Dserver.rmi.ssl.disable=true -Dserver.rmi.localport=50000 -Juser_offset=0

  worker2:
    <<: *worker
    command: jmeter-server -Dserver.rmi.ssl.disable=true -Dserver.rmi.localport=50000 -Juser_offset=500

  controller:
    <<: *worker
    volumes:
      - ./:/tests
    depends_on: [worker1, worker2]
    command: >
      jmeter -n -t autoledger_load_test.jmx
      -R worker1,worker2 -Dserver.rmi.ssl.disable=true
      -l results/distributed/results.jtl -e -o results/distributed/report
      -Ghost=${TARGET_HOST:-host.docker.internal} -Gport=${TARGET_PORT:-8000}
      -Gvisitors=${VISITORS:-15} -Gdrivers=${DRIVERS:-25} -Gsignups=${SIGNUPS:-2}
      -Grampup=${RAMPUP:-60} -Gduration=${DURATION:-300}
